<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nos films</title>
  <meta name="theme-color" content="#0b0b0d">
  <script>
    // Applique le thème choisi avant l'affichage, pour éviter un flash.
    try { const t = JSON.parse(localStorage.getItem('settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nos films">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-6.2H9.2v6.2H5A1.5 1.5 0 0 1 3.5 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M6 3.5h12a1 1 0 0 1 1 1v16l-7-4.2-7 4.2v-16a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-cine" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></g></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="2.5" y="4.5" width="19" height="13" rx="2.5"/><path d="M8 21h8"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8v14.4a.8.8 0 0 0 1.2.7l11.6-7.2a.8.8 0 0 0 0-1.4L8.7 4.1a.8.8 0 0 0-1.2.7z" fill="currentColor"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a16 16 0 0 1-2.6 3.2M6.3 7.6C4.2 9.2 3 12 3 12s4 6 9 6c1.5 0 2.9-.5 4.1-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.6 2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.6l-5.1 2.6 1-5.6-4.1-4 5.7-.8z" fill="currentColor"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3.5 8.5V6a1 1 0 0 1 1-1h15a1 1 0 0 1 1 1v2.5a2.5 2.5 0 0 0 0 5V16a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-2.5a2.5 2.5 0 0 0 0-5zM14 5v12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="0"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand"><span class="brand-mark"><svg><use href="#i-play"/></svg></span><span>Nos <i>films</i></span></div>
      <button class="side-search" data-open-search><svg><use href="#i-search"/></svg>Rechercher<kbd>⌘K</kbd></button>
      <nav class="side-nav">
        <button data-tab="accueil"><svg><use href="#i-home"/></svg>Accueil</button>
        <button data-tab="liste"><svg><use href="#i-list"/></svg>Notre liste<span class="count" id="count-todo"></span></button>
        <button data-tab="cine"><svg><use href="#i-cine"/></svg>Au cinéma<span class="count" id="count-cine"></span></button>
        <button data-tab="streaming"><svg><use href="#i-tv"/></svg>Streaming</button>
        <button data-tab="explorer"><svg><use href="#i-search"/></svg>Explorer</button>
      </nav>
      <div class="side-scroll">
        <div class="side-section" id="side-tonight"></div>
        <div class="side-section"><div class="side-label">Nos plateformes<button class="side-edit" data-tab="reglages">Modifier</button></div><div id="side-providers" class="side-providers"></div></div>
        <div class="side-section" id="side-family"></div>
      </div>
      <button class="side-user" data-tab="reglages"><span id="side-avatar"></span><span><b id="side-name">Profil</b><small>Réglages</small></span><svg><use href="#i-gear"/></svg></button>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 id="view-title">Accueil</h1>
        <div class="topbar-actions">
          <button class="icon-btn" data-open-search aria-label="Rechercher"><svg><use href="#i-search"/></svg></button>
          <button class="icon-btn mobile-only" data-tab="reglages" aria-label="Réglages"><svg><use href="#i-gear"/></svg></button>
        </div>
      </header>
      <div id="view-tools" class="tools"></div>
      <main id="view" class="view"></main>
    </div>

    <nav class="tabbar" aria-label="Navigation">
      <button data-tab="accueil"><svg><use href="#i-home"/></svg><span>Accueil</span></button>
      <button data-tab="liste"><svg><use href="#i-list"/></svg><span>Liste</span></button>
      <button data-tab="cine"><svg><use href="#i-cine"/></svg><span>Ciné</span></button>
      <button data-tab="streaming"><svg><use href="#i-tv"/></svg><span>Streaming</span></button>
      <button data-tab="explorer"><svg><use href="#i-search"/></svg><span>Explorer</span></button>
    </nav>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <article class="sheet-panel" role="dialog" aria-modal="true">
      <div class="grabber"></div>
      <div class="sheet-nav">
        <button class="icon-btn glass" id="sheet-back" aria-label="Retour" hidden><svg><use href="#i-back"/></svg></button>
        <span></span>
        <button class="icon-btn glass" data-close aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="sheet-content"></div>
    </article>
  </div>

  <div id="palette" class="palette" hidden>
    <div class="palette-backdrop" data-close-search></div>
    <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Recherche">
      <div class="palette-input"><svg><use href="#i-search"/></svg><input id="palette-q" type="search" placeholder="Un film, un acteur, une réalisatrice…" autocomplete="off" enterkeyhint="search"><button class="link" data-close-search>Annuler</button></div>
      <div id="palette-results" class="palette-results"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
